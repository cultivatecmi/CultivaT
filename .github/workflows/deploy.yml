# Compila CultivaT como sitio estático y lo publica en GitHub Pages.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Instalar dependencias
        run: npm ci

      # GitHub Pages solo sirve archivos estáticos: la ruta /api/chat (Gemini) no aplica ahí.
      # Sabi usa automáticamente sus respuestas preprogramadas.
      - name: Quitar rutas de servidor
        run: rm -rf src/app/api

      # Next descarga Fredoka y Nunito de Google Fonts al compilar; si Google falla
      # un momento, se reintenta hasta 3 veces antes de rendirse.
      - name: Compilar sitio estático
        run: |
          for intento in 1 2 3; do
            if npm run build; then exit 0; fi
            echo "::warning::La compilación falló (intento $intento de 3). Reintentando en 20 s..."
            sleep 20
          done
          exit 1
        env:
          GITHUB_PAGES: "true"
          NEXT_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Evitar procesamiento Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
